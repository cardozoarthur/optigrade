services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: optigrade-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-optigrade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-optigrade}
      POSTGRES_DB: ${POSTGRES_DB:-optigrade}
    ports:
      - "55432:5432"
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=1GB"
      - "-c"
      - "work_mem=64MB"
      - "-c"
      - "maintenance_work_mem=512MB"
      - "-c"
      - "effective_cache_size=8GB"
      - "-c"
      - "max_connections=100"
    volumes:
      - optigrade-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-optigrade} -d ${POSTGRES_DB:-optigrade}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  optigrade-postgres:

