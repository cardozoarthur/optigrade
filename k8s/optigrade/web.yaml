apiVersion: v1
kind: Service
metadata:
  name: optigrade-web
  namespace: optigrade
  labels:
    app.kubernetes.io/name: optigrade
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: optigrade
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: optigrade-web
  namespace: optigrade
  labels:
    app.kubernetes.io/name: optigrade
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: optigrade
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: optigrade
        app.kubernetes.io/component: web
    spec:
      initContainers:
        - name: wait-for-api
          image: busybox:1.37
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until wget -q -O /dev/null http://optigrade-api:8000/health; do sleep 2; done
      containers:
        - name: web
          image: ttl.sh/optigrade-web-20260505-093031:24h
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: optigrade-config
            - secretRef:
                name: optigrade-secrets
          readinessProbe:
            httpGet:
              path: /sign-in
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /sign-in
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
