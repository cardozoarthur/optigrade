apiVersion: v1
kind: Service
metadata:
  name: optigrade-api
  namespace: optigrade
  labels:
    app.kubernetes.io/name: optigrade
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: optigrade
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: optigrade-api
  namespace: optigrade
  labels:
    app.kubernetes.io/name: optigrade
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: optigrade
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: optigrade
        app.kubernetes.io/component: api
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: optigrade-secrets
          command:
            - sh
            - -c
            - until pg_isready -h optigrade-postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do sleep 2; done
        - name: migrate-and-seed
          image: ttl.sh/optigrade-api-20260505-result-details:24h
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: optigrade-config
            - secretRef:
                name: optigrade-secrets
          command:
            - sh
            - -c
            - alembic upgrade head && python -m app.seed
      containers:
        - name: api
          image: ttl.sh/optigrade-api-20260505-result-details:24h
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: optigrade-config
            - secretRef:
                name: optigrade-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "4"
              memory: 4Gi
