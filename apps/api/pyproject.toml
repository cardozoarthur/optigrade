[project]
name = "optigrade-api"
version = "0.1.0"
description = "FastAPI backend for OptiGrade."
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.16.0",
  "beautifulsoup4>=4.14.3",
  "fastapi>=0.116.0",
  "numpy>=2.2.0",
  "openai>=1.90.0",
  "optuna>=4.4.0",
  "ortools>=9.12.0",
  "psycopg[binary]>=3.2.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.9.0",
  "python-multipart>=0.0.20",
  "ray[default]>=2.48.0",
  "sqlalchemy>=2.0.40",
  "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.4.0",
  "pytest-cov>=6.2.0",
  "ruff>=0.12.0"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
